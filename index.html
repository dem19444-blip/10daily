<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10Daily</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232ecc71%22/><text y=%22.9em%22 x=%2250%%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>10</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232ecc71%22/><text y=%22.9em%22 x=%2250%%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>10</text></svg>">
    
    <style>
        :root { --primary: #2ecc71; --bg: #f4f7f6; --text: #2c3e50; --muted: #95a5a6; --accent: #e67e22; --info: #2980b9; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; box-sizing: border-box; }
        .header-container { text-align: center; margin-bottom: 15px; }
        .day-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .nav-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--primary); padding: 5px 15px; font-weight: bold; }
        .progress-link { color: var(--info); font-size: 0.85rem; font-weight: bold; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 5px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; box-sizing: border-box; text-align: center; }
        .focus-box { font-style: italic; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.4; border-left: 3px solid var(--accent); padding-left: 10px; text-align: left; }
        .exercise-list { list-style: none; padding: 0; margin: 20px 0; display: flex; flex-direction: column; align-items: center; }
        .exercise-item { width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 10px; background: #f8f9fa; color: var(--muted); font-weight: 600; box-sizing: border-box; transition: 0.3s; font-size: 1rem; }
        .exercise-item.active { background: #eafff0; color: var(--primary); transform: scale(1.05); border: 1px solid var(--primary); }
        #timer-container { display: none; margin-bottom: 20px; }
        #timer-display { font-size: 5.5rem; font-weight: 800; margin: -10px 0; line-height: 1; }
        #status-label { font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .btn-group { display: flex; gap: 10px; width: 100%; }
        button { flex: 1; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .workout-footer { display: none; justify-content: space-between; align-items: center; width: 100%; margin-top: 20px; }
        .set-indicator { font-weight: bold; color: var(--muted); font-size: 1.1rem; flex: 1; text-align: left; }
        .pause-btn { background: #3498db; flex: 1.5; margin-right: 10px; }
        .stop-btn { background: #e74c3c; flex: 1; }

        /* Music Mode Switch */
        .music-toggle-box { margin-top: 15px; padding: 12px; background: #f0f3f5; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
        .music-toggle-box label { font-size: 0.8rem; font-weight: bold; color: var(--text); margin: 0; text-transform: none; cursor: pointer; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Step Buttons */
        .step-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }
        .step-btn { background: #ecf0f1; color: var(--text); width: 45px; height: 45px; border-radius: 10px; border: 1px solid #ddd; font-size: 1.4rem; cursor: pointer; }
        .step-display { width: 80px; font-weight: bold; font-size: 1.2rem; }

        .hidden { display: none !important; }
        .setup-row { margin-bottom: 20px; text-align: center; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- SILENCE PLAYER -->
    <audio id="silent-loop" loop preload="auto">
        <source src="Silence.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="main-view">
        <div class="header-container">
            <div class="day-nav">
                <button class="nav-btn" onclick="changeDay(-1)">&#10094;</button>
                <h1 id="day-name" style="margin:0; font-size: 1.4rem;">Monday</h1>
                <button class="nav-btn" onclick="changeDay(1)">&#10095;</button>
            </div>
            <span class="progress-link" onclick="showProgress()">Weekly Progress</span>
        </div>

        <div class="card">
            <div id="focus-display" class="focus-box">Focus: Loading...</div>
            
            <div id="timer-container">
                <div id="status-label">GET READY</div>
                <div id="timer-display">10</div>
            </div>

            <ul class="exercise-list" id="exercise-display-list"></ul>

            <div id="main-controls">
                <div class="btn-group">
                    <button onclick="startWorkout()">START</button>
                    <button style="background:#3498db" onclick="showEditor()">TAILOR</button>
                </div>

                <div class="music-toggle-box">
                    <label for="music-mode">Playing Background Music?<br><small>(Spotify / Apple Music)</small></label>
                    <label class="switch">
                        <input type="checkbox" id="music-mode">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="workout-footer" id="workout-footer">
                <div class="set-indicator" id="set-display">SET 1/3</div>
                <button id="btn-pause" class="pause-btn" onclick="togglePause()">PAUSE</button>
                <button class="stop-btn" onclick="quitWorkout()">STOP</button>
            </div>
        </div>
    </div>

    <!-- Progress View -->
    <div class="container hidden" id="progress-view">
        <h1 style="text-align: center; color: var(--primary);">Weekly Progress</h1>
        <div class="progress-list" id="progress-list-content"></div>
        <div class="btn-group">
            <button style="background: var(--muted);" onclick="goBackToWorkout()">Back</button>
            <button style="background: var(--accent);" onclick="resetWeek()">Reset Week</button>
        </div>
    </div>

    <!-- Editor View -->
    <div class="container hidden" id="editor-view">
        <div class="card">
            <button style="background:#3498db; margin-bottom:20px; width:100%" onclick="hideEditor()">&#10094; Back</button>
            <h3 id="edit-header" style="margin-top:0">Tailor</h3>
            
            <div class="setup-row">
                <label>Daily Focus</label>
                <textarea id="edit-focus" rows="2" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
            </div>

            <div class="setup-row">
                <label>Work Duration (seconds)</label>
                <div class="step-row">
                    <button class="step-btn" onclick="changeVal('edit-work', -5)">-</button>
                    <div id="edit-work" class="step-display">30</div>
                    <button class="step-btn" onclick="changeVal('edit-work', 5)">+</button>
                </div>
            </div>

            <div class="setup-row">
                <label>Rest Duration (seconds)</label>
                <div class="step-row">
                    <button class="step-btn" onclick="changeVal('edit-rest', -5)">-</button>
                    <div id="edit-rest" class="step-display">10</div>
                    <button class="step-btn" onclick="changeVal('edit-rest', 5)">+</button>
                </div>
            </div>

            <div id="exercise-inputs"></div>
            <button onclick="saveRoutine()" style="width:100%; margin-top:10px; margin-bottom:20px;">SAVE CHANGES</button>
        </div>
    </div>

    <script>
        const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        let workoutData = JSON.parse(localStorage.getItem('runnerWorkouts_v11')) || {
            1: { focus: "Strength and Achilles resilience.", work: 30, rest: 10, ex: ["Squats", "Reverse Lunges", "Single-leg Romanian Deadlift", "Sprinter Bridges", "Single-leg Calf Raises"] },
            2: { focus: "Arm drive and posture.", work: 30, rest: 10, ex: ["Press-ups", "Diamond Press-ups", "Triceps Dips", "High Plank Shoulder Taps", "Arm Circles"] },
            3: { focus: "Core stability.", work: 30, rest: 10, ex: ["Front Plank", "Side Plank", "Side Plank", "Dead Bug", "Bird Dog"] },
            4: { focus: "Balance and coordination.", work: 30, rest: 10, ex: ["Split Squats", "Single-leg Balance", "Side Lunges", "Plank Shoulder Taps", "Single-leg Glute Bridges"] },
            5: { focus: "Hip stability and glute activation.", work: 30, rest: 10, ex: ["Clamshells", "Fire Hydrants", "Donkey Kicks", "Side-lying Leg Raise", "Single-leg Glute Bridges"] },
            6: { focus: "Athletic movement.", work: 30, rest: 10, ex: ["Mountain Climbers", "Reverse Crunch", "Flutter Kicks", "Bicycle Crunch", "Tibialis Raises"] },
            0: { focus: "Rest and recover.", work: 0, rest: 0, ex: [] }
        };

        let completedDays = JSON.parse(localStorage.getItem('runnerCompletion_v11')) || [];
        let viewDay = new Date().getDay(); 
        let timerInterval, isPaused = false, timeline = [], stepIdx = 0, secondsLeft = 0, wakeLock = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function beep(freq, duration, vol) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        async function victorySequence() {
            for(let i=0; i<9; i++) {
                beep(1200, 0.08, 0.4);
                await new Promise(r => setTimeout(r, 120));
            }
            beep(1500, 1.0, 0.6);
        }

        function changeVal(id, amount) {
            let el = document.getElementById(id);
            let val = parseInt(el.innerText);
            el.innerText = Math.max(0, val + amount);
        }

        function init() {
            const data = workoutData[viewDay];
            document.getElementById('day-name').innerText = DAYS[viewDay];
            document.getElementById('focus-display').innerText = "Focus: " + data.focus;
            const list = document.getElementById('exercise-display-list');
            if (viewDay === 0 && data.ex.length === 0) {
                list.innerHTML = "<li class='exercise-item active'>Enjoy your rest day!</li>";
                document.getElementById('main-controls').style.display = 'none';
            } else {
                list.innerHTML = data.ex.map((e, i) => `<li class="exercise-item" id="ex-item-${i}">${e}</li>`).join('');
                document.getElementById('main-controls').style.display = 'block';
            }
        }

        async function startWorkout() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Handle Silence logic
            const bgMusicOn = document.getElementById('music-mode').checked;
            if (!bgMusicOn) {
                document.getElementById('silent-loop').play().catch(()=>{});
            }

            // Wake Lock
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }

            const data = workoutData[viewDay];
            document.getElementById('main-controls').style.display = 'none';
            document.getElementById('timer-container').style.display = 'block';
            document.getElementById('workout-footer').style.display = 'flex';
            document.getElementById('focus-display').classList.add('hidden');

            timeline = [{ type: 'GET READY', time: 10, hIdx: 0, round: 1 }];
            for(let r=1; r<=3; r++) {
                data.ex.forEach((name, i) => {
                    timeline.push({ type: 'WORK', time: data.work, hIdx: i, round: r });
                    if(!(r===3 && i===4)) timeline.push({ type: 'REST', time: data.rest, hIdx: (i+1)%5, round: r });
                });
            }
            stepIdx = 0; secondsLeft = timeline[0].time; isPaused = false; runTimer();
        }

        function runTimer() {
            updateUI();
            timerInterval = setInterval(async () => {
                if (isPaused) return;
                secondsLeft--;
                if (secondsLeft <= 3 && secondsLeft > 0) beep(600, 0.15, 0.5);
                if (secondsLeft < 0) {
                    stepIdx++;
                    if (stepIdx >= timeline.length) { 
                        clearInterval(timerInterval); 
                        await victorySequence();
                        if (viewDay !== 0 && !completedDays.includes(viewDay)) {
                            completedDays.push(viewDay);
                            localStorage.setItem('runnerCompletion_v11', JSON.stringify(completedDays));
                        }
                        alert("Session Complete!"); 
                        quitWorkout();
                        showProgress(); // Jump to progress
                        return; 
                    }
                    beep(1200, 0.6, 0.7);
                    secondsLeft = timeline[stepIdx].time;
                }
                updateUI();
            }, 1000);
        }

        function updateUI() {
            const step = timeline[stepIdx];
            document.getElementById('status-label').innerText = step.type;
            document.getElementById('status-label').style.color = step.type==='WORK'?'var(--primary)':'var(--accent)';
            document.getElementById('timer-display').innerText = Math.max(0, secondsLeft);
            document.getElementById('set-display').innerText = `SET ${step.round}/3`;
            document.querySelectorAll('.exercise-item').forEach((el, idx) => el.classList.toggle('active', idx === step.hIdx));
        }

        function quitWorkout() {
            clearInterval(timerInterval);
            document.getElementById('silent-loop').pause();
            if (wakeLock) { wakeLock.release().then(() => wakeLock = null); }
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('workout-footer').style.display = 'none';
            document.getElementById('main-controls').style.display = 'block';
            document.getElementById('focus-display').classList.remove('hidden');
            init();
        }

        function togglePause() { 
            isPaused = !isPaused; 
            document.getElementById('btn-pause').innerText = isPaused ? "RESUME" : "PAUSE"; 
        }

        function showEditor() {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('editor-view').classList.remove('hidden');
            const data = workoutData[viewDay];
            document.getElementById('edit-header').innerText = "Tailor " + DAYS[viewDay];
            document.getElementById('edit-focus').value = data.focus;
            document.getElementById('edit-work').innerText = data.work;
            document.getElementById('edit-rest').innerText = data.rest;
            let html = "";
            for(let i=0; i<5; i++) {
                html += `<div class="setup-row"><label>Exercise ${i+1}</label><input id="input-ex-${i}" value="${data.ex[i]}" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></div>`;
            }
            document.getElementById('exercise-inputs').innerHTML = html;
        }

        function saveRoutine() {
            const data = workoutData[viewDay];
            data.focus = document.getElementById('edit-focus').value;
            data.work = parseInt(document.getElementById('edit-work').innerText);
            data.rest = parseInt(document.getElementById('edit-rest').innerText);
            for(let i=0; i<5; i++) data.ex[i] = document.getElementById(`input-ex-${i}`).value;
            localStorage.setItem('runnerWorkouts_v11', JSON.stringify(workoutData));
            hideEditor(); init();
        }

        function hideEditor() { document.getElementById('main-view').classList.remove('hidden'); document.getElementById('editor-view').classList.add('hidden'); }
        function changeDay(dir) { viewDay = (viewDay + dir + 7) % 7; init(); }
        function goBackToWorkout() { document.getElementById('progress-view').classList.add('hidden'); document.getElementById('main-view').classList.remove('hidden'); init(); }
        
        function showProgress() {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('progress-view').classList.remove('hidden');
            const list = document.getElementById('progress-list-content');
            list.innerHTML = "";
            for (let i = 1; i <= 6; i++) {
                const done = completedDays.includes(i);
                list.innerHTML += `<div class="progress-day-row ${done ? 'is-done' : ''}" onclick="jumpToDay(${i})">${DAYS[i]} <span>${done ? '&#10003;' : ''}</span></div>`;
            }
        }
        function jumpToDay(day) { viewDay = day; goBackToWorkout(); }
        function resetWeek() { if(confirm("Reset Week?")) { completedDays = []; localStorage.setItem('runnerCompletion_v11', "[]"); showProgress(); } }

        init();
    </script>
</body>
</html>
